<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b5179e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7209b7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0519" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0aaff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#3c096c"/>
    </linearGradient>
    <linearGradient id="crystalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#240046"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#bgGlow)"/>
  <!-- Energy Ring -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#e0aaff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7" transform="rotate(-25 50 50)"/>
  <!-- Faceted Crystal Facets -->
  <polygon points="50,12 72,38 50,55 28,38" fill="url(#crystalGrad1)" opacity="0.95"/>
  <polygon points="50,55 72,38 64,74 50,88" fill="url(#crystalGrad2)" opacity="0.9"/>
  <polygon points="50,55 28,38 36,74 50,88" fill="url(#crystalGrad1)" opacity="0.85"/>
  <polygon points="50,12 50,55 72,38" fill="#e0aaff" opacity="0.4"/>
  <polygon points="50,55 50,88 64,74" fill="#ffffff" opacity="0.3"/>
</svg>